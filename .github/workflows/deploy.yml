name: Deploy

on:
  push:
    branches: [main]
  # npm download counts are read at build time, so a daily rebuild keeps them
  # from going stale without putting a fetch in the visitor's browser. An odd
  # minute avoids the crowd that schedules on the hour.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# A second push while one deploy is mid-flight would race the rsync
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # The Caddyfile on the server pins this hash in its Content-Security-Policy.
      # Editing the theme-init script in Base.astro changes the hash, and the browser
      # would then silently refuse to run it: dark mode would stop remembering itself
      # with nothing in the console to say why. Catch it here instead, where it is loud.
      - name: Check the inline script hash still matches the CSP
        run: |
          node --input-type=module -e '
            import { readFileSync, readdirSync, statSync } from "node:fs";
            import { createHash } from "node:crypto";
            import { join } from "node:path";

            const EXPECTED = "sha256-MWuTONv5iCEDd0eDtv7rkRfwsZv2U6fTo++HXsKah4c=";

            const walk = (d) => readdirSync(d).flatMap((f) => {
              const p = join(d, f);
              return statSync(p).isDirectory() ? walk(p) : p.endsWith(".html") ? [p] : [];
            });

            const found = new Set();
            for (const file of walk("dist")) {
              const html = readFileSync(file, "utf8");
              for (const m of html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)) {
                if (!m[2].trim()) continue;
                if (m[1].includes("application/ld+json")) continue;
                found.add("sha256-" + createHash("sha256").update(m[2]).digest("base64"));
              }
            }

            const list = [...found];
            if (list.length === 1 && list[0] === EXPECTED) {
              console.log("Inline script hash unchanged.");
              process.exit(0);
            }
            console.error("The inline scripts no longer match the CSP on the server.");
            console.error("Expected exactly one block:", EXPECTED);
            console.error("Built instead:", list.length ? list.join("\n  ") : "(none)");
            console.error("");
            console.error("Update script-src in the tungln.is-a.dev block of the server");
            console.error("Caddyfile, and the EXPECTED value in this workflow, then retry.");
            process.exit(1);
          '

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # The key is restricted server-side by rrsync to write-only access to the
      # portfolio directory, so the path here is relative to that directory.
      - name: Upload to server
        run: rsync -az --delete dist/ ${{ secrets.DEPLOY_TARGET }}:./

      - name: Verify the site answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 ${{ secrets.SITE_URL }})
          echo "Home page returned $code"
          test "$code" = "200"
