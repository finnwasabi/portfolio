<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #120e1a; color: #f3efe7;
         font-family: "Inter Variable", system-ui, sans-serif; overflow: hidden;
         position: relative; display: flex; flex-direction: column;
         justify-content: space-between; padding: 76px 80px; }
  .grid { position: absolute; inset: 0;
          background-image:
            linear-gradient(to right, rgba(243,239,231,.07) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(243,239,231,.07) 1px, transparent 1px),
            radial-gradient(circle at 1px 1px, rgba(217,164,65,.35) 2.5px, transparent 0);
          background-size: 46px 46px, 46px 46px, 46px 46px; }
  .glow { position: absolute; width: 720px; height: 720px; right: -160px; top: -260px;
          border-radius: 50%; filter: blur(90px);
          background: radial-gradient(circle, rgba(217,164,65,.30), transparent 68%); }
  .top, .bottom { position: relative; }
  .eyebrow { font-family: "JetBrains Mono Variable", monospace; font-size: 20px;
             letter-spacing: .16em; text-transform: uppercase; color: #9a8fa8; }
  h1 { font-family: "Unbounded Variable", sans-serif; font-weight: 800; font-size: 104px;
       line-height: 1.02; letter-spacing: -.03em; margin-top: 26px; }
  .rule { width: 84px; height: 4px; background: #d9a441; margin-top: 34px; }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .role { font-size: 30px; color: #f3efe7; line-height: 1.35; max-width: 620px; }
  .role span { color: #9a8fa8; }
  .site { font-family: "JetBrains Mono Variable", monospace; font-size: 22px; color: #d9a441;
          white-space: nowrap; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="top">
    <p class="eyebrow">Front-end Developer · Ho Chi Minh City</p>
    <h1>Le Nhat Tung</h1>
    <div class="rule"></div>
  </div>

  <div class="bottom">
    <p class="role">Interfaces that hold up in production.<br><span>React · Next.js · Refine · Design systems</span></p>
    <p class="site">tungln.is-a.dev</p>
  </div>
</body>
</html>
